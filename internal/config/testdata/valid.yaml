log_level: "debug"

server:
  port: 8080
  shutdown_timeout: 100ms

policy:
  config: casbin_model.conf

auth:
  update_key_interval: 1h
  secret_key: your-key

vault:
  address: "https://localhost:8200"
  token: "vault-token"

redis:
  type: "single"
  host: "localhost"
  port: 6379

postgres:
  host: localhost
  port: 5432
  user: user
  db_name: db
  password: pass
  insert_timeout: 5s
  read_timeout: 5s