log_level: "debug"

server:
  port: 8080
  shutdown_timeout: 100ms

policy:
  config: casbin_model.conf

# fga - модуль для работы с OpenFGA.
openfga:
  api_url: "http://localhost:1234"
  authorization_model: "testpath/testfile.fga"
  store_name: "notes-bot" # имя store из docker-compose fga-setup
  # store_id: ""          # можно указать явно, если store уже создан
  apply_model_on_start: false # true — применить модель при каждом старте

auth:
  update_key_interval: 1h
  secret_key: your-key
  issuer: "test"
  token_duration: 1h
  user_cache_ttl: 1h

audit:
  # Включить отправку в RabbitMQ
  broker_enabled: true
  
  # Топик по умолчанию
  topic: ""
  
  # Фильтр по типам ошибок (минимум 1)
  kinds:
    # Отправлять в RabbitMQ (остальные идут только в stdout)
    include:
      - infra      # критично, алерты
      - internal   # баги, паники
      - external   # внешние API сбои
    # Исключить (даже если в include)
    exclude: []
  
  # Уровни логов
  levels:
    include:
      - error
      - fatal
    exclude: []

rabbitmq:
  # Connection string
  url: "amqp://localhost:5672/"
  
  # Таймауты
  connect_timeout: 5s
  publish_timeout: 2s
  
  # Retry
  max_retries: 3
  retry_backoff: 100ms

vault:
  address: "https://localhost:8200"
  token: "vault-token"
  secrets_path: "secret/data"

redis:
  type: "single"
  host: "localhost"
  port: 6379

postgres:
  host: localhost
  port: 5432
  user: user
  db_name: db
  password: pass
  insert_timeout: 5s
  read_timeout: 5s