# После проверки доступа к объекту сервис проверяет каждое поле запроса update.
[request_definition]
r = resource, action, field

# Каждая разрешающая строка policy.csv задаёт тип ресурса, действие и имя поля.
[policy_definition]
p = resource, action, field

# Для разрешения поля требуется хотя бы одно подходящее правило.
[policy_effect]
e = some(where (p.eft == allow))

# Тип ресурса, действие и имя поля должны полностью совпадать с одной строкой.
[matchers]
m = r.resource == p.resource && r.action == p.action && r.field == p.field
