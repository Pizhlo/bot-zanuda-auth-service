name: Check, Lint, Test and Build

on:
  push:
    branches:
      - main

jobs:
  pytests:
    uses: ./.github/workflows/pytests.yaml
    secrets: inherit

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify dependencies && check go.mod
        run: make check

      - name: Install linters
        run: make install-linters

      - name: Run linters
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test
        run: go test -gcflags="-l" -race -v ./...

  # тестовый билд образа
  build:
    runs-on: ubuntu-latest
    needs:
      - audit
      - test
      - pytests
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        env:
          BUILD_IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO_NAME }}:build-${{ github.sha }}
        run: >-
          docker build . -t "$BUILD_IMAGE"
          --build-arg VERSION=${GITHUB_SHA}
          --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          --build-arg GIT_COMMIT=${GITHUB_SHA}

  # пуш образа в Docker Hub
  push-image:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO_NAME }}
          tags: type=raw,value=latest
          labels: latest

      # Сервис требует непустые метаданные; дата передаётся в публикуемый бинарник.
      - name: Build timestamp
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ steps.build-time.outputs.value }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
