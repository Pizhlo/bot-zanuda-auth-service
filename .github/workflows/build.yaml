name: Docker Image CI

on:
  push: # запуск только на не основных ветках
    branches-ignore:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      env:
        BUILD_IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO_NAME }}:build-${{ github.sha }}
      # Сервис проверяет метаданные при старте; проверочный образ тоже должен их иметь.
      run: |
        docker build . -t "$BUILD_IMAGE" \
          --build-arg VERSION="${GITHUB_SHA}" \
          --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --build-arg GIT_COMMIT="${GITHUB_SHA}"
