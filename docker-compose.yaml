services:
  vault:
    image: hashicorp/vault:1.18
    container_name: auth-service-vault-local
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - vault_data:/vault/file
    command: ["server", "-dev"]

  setup-vault: # подготавливает vault для работы сервиса. добавляет bot API key в vault.
    image: hashicorp/vault:1.18
    container_name: auth-service-vault-setup-local
    profiles:
      - init
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      BOT_API_KEY: ${BOT_API_KEY} # bot API key
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_SECRETS_PATH: ${VAULT_SECRETS_PATH:-secret/data/api-key} # путь по умолчанию, если не задан
    depends_on:
      vault:
        condition: service_healthy 
    volumes:
      - vault_data:/vault/file 
    network_mode: "service:vault"
    command: >
      sh -c "
        echo '🔑 Vault initialized' &&
        vault login $${VAULT_DEV_ROOT_TOKEN_ID} &&
        if vault kv put $${VAULT_SECRETS_PATH} api_key=$${BOT_API_KEY}; then
          echo '✅ API key written to $${VAULT_SECRETS_PATH}' &&
          echo '🔑 Setup complete' &&
          exit 0
        else
          echo '❌ FAILED to write API key to $${VAULT_SECRETS_PATH}' &&
          exit 1
        fi
      "

  redis:
    image: "redis:alpine"
    container_name: auth-service-redis-local
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16
    container_name: auth-service-postgres-local
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: auth-service-rabbitmq-local
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Инициализация очередей: DLX, DLQ, policy и очередь errors.auth-service.
  # Запускается отдельно через `make docker-tests-up` (profile init), не вместе с `up`:
  # иначе `--abort-on-container-exit` остановит стек при exit code 0 setup-контейнера.
  rabbitmq-setup:
    image: curlimages/curl
    container_name: auth-service-rabbitmq-setup-tests
    profiles:
      - init
    depends_on:
      rabbitmq:
        condition: service_healthy
    network_mode: "service:rabbitmq"
    volumes:
      - ./scripts/rabbitmq-setup.sh:/setup/rabbitmq-setup.sh:ro
    command: ["sh", "/setup/rabbitmq-setup.sh"]

volumes:
  vault_data:
  redis-data:
  pgdata:
  rabbitmq-data: