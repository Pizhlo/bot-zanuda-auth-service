; Конфигурация для работы модуля с casbin: https://github.com/casbin/casbin
; Позволяет реализовывать RBAC, ABAC, ACL.

[request_definition]
; r.sub    — пользователь (user:id)
; r.dom    — пространство (space:id)
; r.obj    — объект (note, reminder, space_settings, invite)
; r.act    — действие (create, read, update, delete, invite, kick, manage)
r = sub, dom, obj, act

[policy_definition]
; p.sub    — роль (role_owner, role_admin, role_editor, role_viewer)
; p.dom    — пространство
; p.obj    — объект
; p.act    — действие
p = sub, dom, obj, act

[role_definition]
; g = user, role, dom (user имеет роль role в пространстве dom)
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
; Пользователь имеет роль p.sub в домене p.dom,
; домен совпадает, объект и действие совпадают.
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && r.obj == p.obj && r.act == p.act
