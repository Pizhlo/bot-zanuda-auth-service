log_level: "debug"

server:
  port: 8080
  shutdown_timeout: 100ms

# конфигурация casbin для работы с политиками и правами
policy:
  config: casbin_model.conf

auth:
  update_key_interval: 1h
  secret_key: your-key
  issuer: "zanuda-auth-service"
  token_duration: 1h

vault:
  address: "https://localhost:8200"
  token: "vault-token"
  # Для разработки: пропускать проверку TLS сертификата
  insecure_skip_tls: true
  # Для production с использованием сертификатов (сгенерированных через make certs):
  # ca_path: "./vault/ca.crt"
  # client_cert_path: "./vault/client.crt"
  # client_key_path: "./vault/client.key"
  secrets_path: "secret/data/"

# пример конфигурации для одиночного Redis
  redis:
    type: "single"
    host: "localhost"
    port: 6379
    insert_timeout: 50
    read_timeout: 50

# пример конфигурации для кластерного Redis
# redis:
#   type: "cluster"
#   addrs:
#     - "localhost:7001"
#     - "localhost:7002"
#     - "localhost:7003"
#     - "localhost:7004"
#     - "localhost:7005"
#     - "localhost:7006"


postgres:
  host: localhost
  port: 5432
  user: user
  db_name: db
  password: pass
  insert_timeout: 5s
  read_timeout: 5s