log_level: "debug"

server:
  port: 8080
  shutdown_timeout: 100ms

# конфигурация casbin для работы с политиками и правами
policy:
  config: casbin_model.conf

auth:
  update_key_interval: 1h
  secret_key: your-key
  issuer: "zanuda-auth-service"
  token_duration: 1h
  user_cache_ttl: 1h

audit:
  # Включить отправку в RabbitMQ
  broker_enabled: true
  
  # Топик по умолчанию
  topic: "errors.auth-service"
  
  # Фильтр по типам ошибок
  kinds:
    # Отправлять в RabbitMQ (остальные идут только в stdout)
    include:
      - infra      # критично, алерты
      - internal   # баги, паники
      - external   # внешние API сбои
    # Исключить (даже если в include)
    exclude: []
  
  # Уровни логов
  levels:
    include:
      - error
      - fatal
    exclude: []

rabbitmq:
  # Connection string
  url: "amqp://guest:guest@localhost:5672/"
  
  # Таймауты
  connect_timeout: 5s
  publish_timeout: 2s
  
  # Retry
  max_retries: 3
  retry_backoff: 100ms

vault:
  address: "https://localhost:8200"
  token: "vault-token"
  # Для разработки: пропускать проверку TLS сертификата
  insecure_skip_tls: true
  # Для production с использованием сертификатов (сгенерированных через make certs):
  # ca_path: "./vault/ca.crt"
  # client_cert_path: "./vault/client.crt"
  # client_key_path: "./vault/client.key"
  secrets_path: "secret/data/"

# пример конфигурации для одиночного Redis
  redis:
    type: "single"
    host: "localhost"
    port: 6379
    insert_timeout: 50
    read_timeout: 50

# пример конфигурации для кластерного Redis
